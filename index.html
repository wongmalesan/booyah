<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Simple Drive Player</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #111;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 10px;
        }

        .player-wrap {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            /* 16:9 */
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .player-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: #2b7cff;
            color: #fff;
        }

        .playlist {
            margin-top: 15px;
            display: grid;
            gap: 8px;
        }

        .item {
            padding: 10px;
            background: #1b1b1b;
            border-radius: 6px;
            cursor: pointer;
        }

        .item:hover {
            background: #333;
        }

        .item.active {
            background: #2b7cff;
        }
    </style>
</head>

<body>

    <div class="container">


        <h3>My Video Player</h3>

        <div class="player-wrap">
            <iframe id="player" src="https://drive.google.com/file/d/1F5WnQF6fJayY25BssZenNBNr0PfIJv9V/preview"
                allow="autoplay; fullscreen" allowfullscreen>
            </iframe>
        </div>

        <div class="controls">
            <button onclick="fullscreen()">Fullscreen</button>
        </div>

        <div class="playlist" id="playlist"></div>
    </div>

    <script>
        const playlist = document.getElementById("playlist");
        const playerWrap = document.querySelector(".player-wrap");
        const player = document.getElementById("player");

        const videos = [
            {title : "Episode 9", url : "https://drive.google.com/file/d/1F5WnQF6fJayY25BssZenNBNr0PfIJv9V/preview"},
            {title : "Episode 10", url : "https://drive.google.com/file/d/1G23PHCqA4NaMfpkDH5xtEMrzInN6PeaQ/preview"},
            {title : "Episode 11", url : "https://drive.google.com/file/d/17sazF1TG6gy6CLY3P7_YV8Q0_ElDwFhi/preview"},
            {title : "Episode 12", url : "https://drive.google.com/file/d/1dEDwywsvBCu5f0_ikWPmfgyPaerLCuy6/preview"},
        ];

        /* render playlist */
        videos.forEach((v, i) => {
            const div = document.createElement("div");
            div.className = "item";
            div.innerText = v.title;

            div.onclick = () => changeVideo(v.url, div);

            playlist.appendChild(div);

            if (i === 0) {
                div.classList.add("active");
            }
        });

        function changeVideo(url, el) {
            player.src = url;

            document.querySelectorAll(".item").forEach(i => i.classList.remove("active"));
            el.classList.add("active");
        }

        /* fullscreen wrapper (lebih smooth) */
        function fullscreen() {
            if (playerWrap.requestFullscreen) {
                playerWrap.requestFullscreen();
            }
        }
    </script>

</body>

</html>
